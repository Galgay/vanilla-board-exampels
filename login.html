<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 게시판</title>
</head>
<body>
  <header>
    <a class="brand" href="index.html">게시판</a>
    <nav aria-label="주 메뉴">
      <a href="index.html">게시판</a>
      <a class="write-link" href="write.html">글쓰기</a>
      <a class="login-link" href="login.html">로그인</a>
      <button class="logout-button" type="button">로그아웃</button>
    </nav>
    <p id="nav-message" role="status"></p>
  </header>
  <main>
    <h1>로그인</h1>
    <form id="login-form">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required placeholder="아이디를 입력하세요">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-message" role="alert" hidden></p>
      <button type="submit">로그인</button>
    </form>
  </main>
  <footer>게시판 실습</footer>
</body>
</html>
